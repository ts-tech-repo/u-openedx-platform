<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
{% if "iitk" in data.ptcType %}
<title>PTC - IIT Kanpur</title>
{% else %}
{% set title_prefix = data.tcType.upper() if data.tcType in ["dtc", "bttc", "rtc"] else "PTC" %}
<title>{{ title_prefix }} - Talentsprint</title>
{% endif %}
</head>

<link rel="shortcut icon" href="https://talentsprint.com/misc/files/img/favicon.ico">
<link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700,800,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="https://dashboard.talentsprint.com/static/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="https://dashboard.talentsprint.com/static/css/style-july-31.css">

<style>
  body {overflow-x:hidden;}
  .footer {
    bottom: 0;
      position: absolute;
      width: 100%;
  }
  p {
    text-align: center;
  }
  </style>
  </head>
  <body>
  <header class="header innerpage-menu confirmation-pg">
      <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="row">
              <div class="col-md-12">
                  <div class="navbar-header">
                    <img src="https://static.talentsprint.com/ptc/lms-${ptc_type}.png" alt="TS" class="dest-logo">
                  </div>
              </div>
            </div>
        </div>
      </nav>
    <p style = "font-size: 25px !important; margin: 10% 20% 20%">${message}</p>
  </header>	
  <footer class = "footer">
    <div class="container">
      <div class="row cpy-txt-row">
        <div class="col-md-12">
          <hr>
          <p align="center" class="cpy-txt" style = "text-align: center; margin-top: 20px;">&copy; <script>document.write(new Date().getFullYear())</script> TalentSprint</p>
        </div>
      </div>
    </div>
  </footer>
  </body>
  </html>

  <!--Jquery Minified File--> 
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 

<script>
$(function(){
    $('img').on("error", function() {
      $(this).attr('src', 'https://static.talentsprint.com/ptc/ts.png');
    });
});
</script>
